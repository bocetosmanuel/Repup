<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100" height="100">
  <defs>
    <linearGradient id="dumbbellGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c600ff" />
      <stop offset="100%" stop-color="#ff00aa" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#00ffb7" />
    </linearGradient>
    <linearGradient id="rGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d0ff" />
      <stop offset="50%" stop-color="#00ffb7" />
      <stop offset="100%" stop-color="#39ff14" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#neonGlow)">
    <!-- Dumbbell -->
    <rect x="80" y="215" width="80" height="20" rx="10" fill="url(#dumbbellGrad)" transform="rotate(-15 120 225)" />
    <rect x="95" y="155" width="22" height="100" rx="11" fill="url(#dumbbellGrad)" transform="rotate(-15 106 205)" />
    <rect x="122" y="165" width="20" height="80" rx="10" fill="url(#dumbbellGrad)" transform="rotate(-15 132 205)" />
    <rect x="147" y="175" width="18" height="60" rx="9" fill="url(#dumbbellGrad)" transform="rotate(-15 156 205)" />

    <!-- Upward Arrow -->
    <path d="M 180 290 L 305 165 L 295 150 L 335 145 L 330 185 L 320 170 Z" fill="url(#arrowGrad)" />

    <!-- R Loop -->
    <path d="M 205 138 C 280 138 380 115 390 195 C 400 275 305 270 280 270" fill="none" stroke="url(#rGrad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 285 270 L 375 365" fill="none" stroke="url(#rGrad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 205 138 L 260 138" fill="none" stroke="url(#rGrad)" stroke-width="26" stroke-linecap="round" />
  </g>
</svg>
